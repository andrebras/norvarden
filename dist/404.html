<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f3f1e9" />
    <title>Page not found — Norvarden</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header wrap">
      <a class="brand" href="/" aria-label="Norvarden home"
        ><img src="/assets/logo.svg" width="235" height="34" alt="Norvarden"
      /></a>
    </header>
    <main id="main" class="hero wrap">
      <div class="eyebrow"><span class="status-dot"></span> 404 / Page not found</div>
      <h1>This path<br />leads <span class="serif">nowhere.</span></h1>
      <div class="hero-bottom">
        <p>
          The page you’re looking for doesn’t exist or has moved.<br />Let’s get you back on the
          route.
        </p>
        <div>
          <a class="button dark" href="/">Back to Norvarden <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </main>
    <footer class="wrap footer">
      <div class="footer-bottom">
        <span>© Norvarden</span><span>Build. Recover. Maintain.</span>
      </div>
    </footer>
  </body>
</html>
